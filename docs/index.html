<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThaunNFL — Fantasy Manager</title>
<meta name="theme-color" content="#10161d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ThaunNFL">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10161d;
    --card: #18212b;
    --border: #24303c;
    --text: #e8edf2;
    --muted: #8a97a5;
    --rojo: #ff5a52;
    --ambar: #ffb224;
    --verde: #3ecf8e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    padding: env(safe-area-inset-top) 14px calc(76px + env(safe-area-inset-bottom));
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 2px 4px;
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  h1 span { color: var(--rojo); }
  #actualizar {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font: 500 13px 'Barlow', sans-serif;
    cursor: pointer;
  }
  #actualizar:active { background: var(--card); }
  #meta {
    color: var(--muted);
    font-size: 12.5px;
    padding: 0 2px 14px;
  }
  #resumen {
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .02em;
    text-transform: uppercase;
    display: none;
  }
  #resumen.ok    { display: block; background: rgba(62,207,142,.10); color: var(--verde); border: 1px solid rgba(62,207,142,.35); }
  #resumen.alerta{ display: block; background: rgba(255,90,82,.10);  color: var(--rojo);  border: 1px solid rgba(255,90,82,.35); }

  .seccion-titulo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 2px 8px;
  }
  #resumen-ligas {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .fl-info { min-width: 0; flex: 1; }
  .fl-liga {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fl-sub {
    color: var(--muted);
    font-size: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 1px;
    flex-wrap: wrap;
  }
  .fl-badge {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 11px;
    letter-spacing: .03em;
  }
  .fl-record { text-align: right; flex-shrink: 0; }
  .fl-marcador {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .02em;
  }
  .fl-pct { color: var(--muted); font-size: 12px; }

  .vista { display: none; }
  .vista.activa { display: block; }

  .fila-roster {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .fila-roster .fr-info { flex: 1; min-width: 0; }
  .fr-titulo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    letter-spacing: .02em;
  }
  .fr-sub { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .nota-letra {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    border-radius: 8px;
    padding: 3px 10px;
    flex-shrink: 0;
    min-width: 38px;
    text-align: center;
  }
  .nota-letra.n-alta   { background: rgba(62,207,142,.15); color: var(--verde); }
  .nota-letra.n-media  { background: rgba(255,178,36,.15); color: var(--ambar); }
  .nota-letra.n-baja   { background: rgba(255,90,82,.15);  color: var(--rojo); }
  .nota-letra.n-rookie { background: rgba(138,151,165,.15); color: var(--muted); }
  .nota-letra.n-vacia  { background: none; color: var(--muted); }

  .jugador-roster {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .jr-info { flex: 1; min-width: 0; }
  .jr-nombre { font-weight: 600; font-size: 13.5px; }
  .jr-sub { color: var(--muted); font-size: 12px; }
  .jr-ranks { text-align: right; flex-shrink: 0; font-size: 12px; }
  .jr-ranks .r-actual { font-weight: 700; }

  .equipo {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--verde);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .equipo.duda { border-left-color: var(--ambar); }
  .equipo.out  { border-left-color: var(--rojo); }

  .cabecera {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 14px;
    background: none;
    border: none;
    color: inherit;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
  }
  .nombres { min-width: 0; }
  .nombre-equipo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nombre-liga {
    color: var(--muted);
    font-size: 12.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .marcador {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: .03em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .marcador .r { color: var(--rojo); }
  .marcador .a { color: var(--ambar); }
  .marcador .v { color: var(--verde); }

  .detalle { display: none; border-top: 1px solid var(--border); }
  .equipo.abierto .detalle { display: block; }
  .jugador {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
  }
  .jugador + .jugador { border-top: 1px solid rgba(36,48,60,.6); }
  .estado {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .05em;
    border-radius: 6px;
    padding: 2px 8px;
    flex-shrink: 0;
    min-width: 40px;
    text-align: center;
  }
  .estado.rojo  { background: rgba(255,90,82,.15);  color: var(--rojo); }
  .estado.ambar { background: rgba(255,178,36,.15); color: var(--ambar); }
  .j-info { min-width: 0; flex: 1; }
  .j-nombre { font-weight: 600; }
  .j-sub { color: var(--muted); font-size: 12.5px; }
  .j-grupo {
    color: var(--muted);
    font-size: 12px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
  }
  .j-grupo.titular { color: var(--text); border-color: var(--muted); }

  .sem-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 0 12px;
  }
  .sem-flecha {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    width: 42px;
    height: 36px;
    font-size: 14px;
    cursor: pointer;
  }
  .sem-flecha:active { background: var(--card); }
  .sem-flecha:disabled { opacity: .25; cursor: default; }
  .sem-titulo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: center;
  }
  .sem-meta { color: var(--muted); font-size: 11.5px; text-align: center; }
  #resumen-semana {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .02em;
    text-transform: uppercase;
    text-align: center;
  }
  .tarjeta-semana {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .tarjeta-semana.gana   { border-left-color: var(--verde); }
  .tarjeta-semana.pierde { border-left-color: var(--rojo); }
  .tarjeta-semana.juego  { border-left-color: var(--ambar); }
  .ts-info { flex: 1; min-width: 0; }
  .ts-liga {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16.5px;
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ts-equipo { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts-rival { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .ts-marcador { text-align: right; flex-shrink: 0; }
  .ts-puntos {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: .02em;
    white-space: nowrap;
  }
  .ts-tag { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; margin-top: 1px; }

  #estado-app, #estado-trades, #estado-rosters, #estado-semana {
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
  }

  #nav-inferior {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 10;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 9px 4px 8px;
    background: none;
    border: none;
    color: var(--muted);
    font: 500 10.5px 'Barlow', sans-serif;
    letter-spacing: .02em;
    cursor: pointer;
  }
  .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .nav-item.activo { color: var(--rojo); }
  .nav-badge {
    position: absolute;
    margin-left: 14px;
    margin-top: -2px;
    background: var(--rojo);
    color: #10161d;
    font-size: 9.5px;
    font-weight: 700;
    border-radius: 999px;
    min-width: 14px;
    height: 14px;
    line-height: 14px;
    text-align: center;
    padding: 0 3px;
  }
</style>
</head>
<body>

<header>
  <h1>Thaun<span>NFL</span></h1>
  <button id="actualizar">Actualizar</button>
</header>
<div id="meta"></div>
<div id="estado-app">Cargando…</div>

<div class="vista activa" id="vista-ligas">
  <div id="resumen"></div>
  <div id="bloque-resumen-ligas" style="display:none">
    <div class="seccion-titulo">Tus ligas</div>
    <div id="resumen-ligas"></div>
  </div>
</div>

<div class="vista" id="vista-semana">
  <div id="estado-semana">Cargando…</div>
  <div class="sem-nav" id="nav-semana" style="display:none">
    <button class="sem-flecha" id="sem-prev" aria-label="Semana anterior">◀</button>
    <div>
      <div class="sem-titulo" id="sem-titulo"></div>
      <div class="sem-meta" id="sem-meta"></div>
    </div>
    <button class="sem-flecha" id="sem-next" aria-label="Semana siguiente">▶</button>
  </div>
  <div id="resumen-semana" style="display:none"></div>
  <div id="lista-semana"></div>
</div>

<div class="vista" id="vista-rosters">
  <div id="estado-rosters">Cargando…</div>
  <div id="breadcrumb-rosters" style="display:none;padding:2px 2px 10px;color:var(--muted);font-size:12.5px;"></div>
  <div id="lista-rosters"></div>
</div>

<div class="vista" id="vista-medico">
  <div id="lista"></div>
</div>

<div class="vista" id="vista-trades">
  <div id="estado-trades">Cargando…</div>
  <div id="lista-trades"></div>
</div>

<nav id="nav-inferior">
  <button class="nav-item activo" data-vista="ligas">
    <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>
    Ligas
  </button>
  <button class="nav-item" data-vista="semana">
    <svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1zM4 9h16M8 2v4M16 2v4"/></svg>
    Semana
  </button>
  <button class="nav-item" data-vista="rosters">
    <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
    Rosters
  </button>
  <button class="nav-item" data-vista="medico" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="M9 3v6M6 6h6M17 3v8a5 5 0 01-10 0"/><path d="M12 15v6M9 21h6"/></svg>
    Parte médico
    <span class="nav-badge" id="badge-medico" style="display:none">0</span>
  </button>
  <button class="nav-item" data-vista="trades" style="position:relative">
    <svg viewBox="0 0 24 24"><path d="M7 10l-4 4 4 4M3 14h13a4 4 0 004-4M17 14l4-4-4-4M21 10H8a4 4 0 00-4 4"/></svg>
    Trades
    <span class="nav-badge" id="badge-trades" style="display:none">0</span>
  </button>
</nav>

<script>
let datos = null;
const abiertos = new Set();

const GRUPOS = { START: 'Titular', BENCH: 'Banquillo', INJURED: 'IR', TAXI: 'Taxi' };

function cargar() {
  document.getElementById('estado-app').textContent = 'Cargando…';
  document.getElementById('estado-app').style.display = 'block';
  fetch('data/status.json?ts=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { datos = d; render(); })
    .catch(() => {
      document.getElementById('estado-app').textContent =
        'No se pudieron cargar los datos. Comprueba la conexión y vuelve a intentarlo.';
    });
}

function render() {
  const meta = document.getElementById('meta');
  const resumen = document.getElementById('resumen');
  const lista = document.getElementById('lista');
  const estadoApp = document.getElementById('estado-app');

  const fecha = new Date(datos.generado);
  meta.textContent = 'Actualizado ' + fecha.toLocaleString('es-ES', {
    weekday: 'short', day: 'numeric', month: 'short',
    hour: '2-digit', minute: '2-digit'
  });

  const ligas = datos.ligas || [];
  if (!ligas.length) {
    estadoApp.textContent = 'No se encontraron ligas en los datos.';
    return;
  }
  estadoApp.style.display = 'none';
  renderResumenLigas(ligas);

  const visibles = l => l.alertas || [];

  let totalJug = 0, totalEq = 0;
  let totalV = 0, totalD = 0, totalE = 0;
  let ligasPositivas = 0, ligasNegativas = 0;
  ligas.forEach(l => {
    const n = visibles(l).length;
    if (n > 0) { totalJug += n; totalEq++; }
    const r = l.record;
    if (r) {
      totalV += r.victorias || 0;
      totalD += r.derrotas || 0;
      totalE += r.empates || 0;
      if ((r.victorias || 0) > (r.derrotas || 0)) ligasPositivas++;
      else if ((r.derrotas || 0) > (r.victorias || 0)) ligasNegativas++;
    }
  });

  const totalPartidos = totalV + totalD + totalE;
  const pct = totalPartidos ? ((totalV / totalPartidos) * 100).toFixed(1) + '%' : '—';
  resumen.className = 'ok';
  resumen.innerHTML =
    `${ligas.length} ligas · ` +
    `<span style="color:var(--verde);">${ligasPositivas} en positivo</span> · ` +
    `<span style="color:var(--rojo);">${ligasNegativas} en negativo</span><br>` +
    `<span style="font-size:15px;">${totalV}-${totalD}${totalE ? '-' + totalE : ''} · ${pct}</span>`;

  const badge = document.getElementById('badge-medico');
  if (totalEq > 0) {
    badge.style.display = 'block';
    badge.textContent = totalEq;
  } else {
    badge.style.display = 'none';
  }

  const orden = [...ligas].sort((a, b) => {
    const peor = l => visibles(l).some(x => x.rojo) ? 0 : visibles(l).length ? 1 : 2;
    return peor(a) - peor(b);
  });

  lista.innerHTML = '';
  orden.forEach(l => {
    const alertas = visibles(l);
    const rojos = alertas.filter(a => a.rojo).length;
    const dudas = alertas.length - rojos;
    const clase = rojos ? 'out' : dudas ? 'duda' : '';
    const clave = String(l.league_id);

    const card = document.createElement('div');
    card.className = 'equipo ' + clase + (abiertos.has(clave) && alertas.length ? ' abierto' : '');

    let marcador = '<span class="v">✓ OK</span>';
    if (alertas.length) {
      const partes = [];
      if (rojos) partes.push(`<span class="r">${rojos} OUT</span>`);
      if (dudas) partes.push(`<span class="a">${dudas} Q</span>`);
      marcador = partes.join(' · ');
    }

    let html = `
      <button class="cabecera" data-k="${clave}" ${alertas.length ? '' : 'disabled'}>
        <div class="nombres">
          <div class="nombre-equipo">${esc(l.liga)}</div>
          <div class="nombre-liga">${esc(l.equipo)}</div>
        </div>
        <div class="marcador">${marcador}</div>
      </button>`;

    if (l.error) {
      html += `<div class="detalle" style="display:block"><div class="jugador j-sub">Error al leer este equipo: ${esc(l.error)}</div></div>`;
    } else if (alertas.length) {
      html += '<div class="detalle">' + alertas.map(a => `
        <div class="jugador">
          <span class="estado ${a.rojo ? 'rojo' : 'ambar'}">${esc(etiqueta(a.estado))}</span>
          <div class="j-info">
            <div class="j-nombre">${esc(a.nombre)}</div>
            <div class="j-sub">${esc(a.posicion)} · ${esc(a.equipo_nfl)}${a.detalle ? ' · ' + esc(a.detalle) : ''}</div>
          </div>
          ${a.grupo ? `<span class="j-grupo ${a.grupo === 'START' ? 'titular' : ''}">${esc(GRUPOS[a.grupo] || a.grupo)}</span>` : ''}
        </div>`).join('') + '</div>';
    }

    card.innerHTML = html;
    lista.appendChild(card);
  });

  lista.querySelectorAll('.cabecera:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.k;
      abiertos.has(k) ? abiertos.delete(k) : abiertos.add(k);
      btn.parentElement.classList.toggle('abierto');
    });
  });
}

function etiqueta(estado) {
  return { QUESTIONABLE: 'Q', DOUBTFUL: 'D', OUT: 'OUT', IR: 'IR', IR_INVALIDO: '⚠' }[estado] || estado;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderResumenLigas(ligas) {
  const bloque = document.getElementById('bloque-resumen-ligas');
  const cont = document.getElementById('resumen-ligas');

  if (!ligas.length) { bloque.style.display = 'none'; return; }
  bloque.style.display = 'block';

  const orden = [...ligas].sort((a, b) => {
    const va = a.record?.victorias ?? -1;
    const vb = b.record?.victorias ?? -1;
    if (vb !== va) return vb - va;
    return (b.record?.pct ?? 0) - (a.record?.pct ?? 0);
  });

  cont.innerHTML = orden.map(l => {
    const r = l.record;
    const marcador = r
      ? `${r.victorias}-${r.derrotas}${r.empates ? '-' + r.empates : ''}`
      : '—';
    const pct = r && r.pct != null ? (r.pct * 100).toFixed(0) + '%' : '';
    const rank = r && r.rank ? `#${r.rank}` : '';
    const clave = 'liga-' + l.league_id;

    return `
      <button class="fila-liga" data-k="${clave}" style="width:100%;border:none;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;align-items:center;gap:10px;padding:12px 14px;">
        <div class="fl-info">
          <div class="fl-liga">${esc(l.liga)}</div>
          <div class="fl-sub">
            <span>${esc(l.equipo)}</span>
            ${l.tipo ? `<span class="fl-badge">${esc(l.tipo)}</span>` : ''}
            ${l.formato ? `<span class="fl-badge">${esc(l.formato)}</span>` : ''}
            ${!l.tipo && !l.formato ? '<span class="fl-badge">Formato no documentado</span>' : ''}
          </div>
        </div>
        <div class="fl-record">
          <div class="fl-marcador">${marcador} ${rank}</div>
          <div class="fl-pct">${pct}</div>
        </div>
      </button>
      <div class="fl-calendario" id="cal-${clave}" style="display:none;padding:4px 14px 12px;"></div>`;
  }).join('');

  cont.querySelectorAll('.fila-liga').forEach(btn => {
    btn.addEventListener('click', () => toggleCalendario(btn.dataset.k));
  });
}

let calendarioData = null;

let calendarioListo = false;

function cargarCalendario() {
  fetch('data/calendario.json?ts=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { calendarioData = d; })
    .catch(() => { calendarioData = null; })
    .finally(() => { calendarioListo = true; renderSemana(); });
}

/* ───────── Panel "Semana" ─────────
   Fuentes: semana.json (semana en curso, marcadores provisionales, se
   refresca varias veces al día) y calendario.json (semanas ya cerradas). */
let semanaData = null;
let semanaListo = false;
let semanaSel = null;

function cargarSemana() {
  fetch('data/semana.json?ts=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { semanaData = d; })
    .catch(() => { semanaData = null; })
    .finally(() => { semanaListo = true; renderSemana(); });
}

function ligasSemana() {
  const base = semanaData?.ligas || calendarioData?.ligas || [];
  return base.map(l => ({ league_id: l.league_id, liga: l.liga, equipo: l.equipo }));
}

function semanaMaxima() {
  if (semanaData?.semana) return semanaData.semana;
  const nums = (calendarioData?.ligas || []).flatMap(l =>
    (l.semanas || []).filter(s => !s.error).map(s => s.semana));
  return nums.length ? Math.max(...nums) : null;
}

function partidoDe(leagueId, semana) {
  if (semanaData && semanaData.semana === semana) {
    const l = (semanaData.ligas || []).find(x => x.league_id === leagueId);
    if (l && l.partido) return l.partido;
  }
  const lc = (calendarioData?.ligas || []).find(x => x.league_id === leagueId);
  return lc?.semanas?.find(s => s.semana === semana && !s.error) || null;
}

function estadoPartido(p) {
  if (!p) return 'sin_datos';
  if (p.jugado) return 'final';
  if ((p.mis_puntos || 0) > 0 || (p.puntos_rival || 0) > 0) return 'en_juego';
  return 'sin_empezar';
}

function semanaPorDefecto(max) {
  // Si la semana en curso aún no ha empezado (p.ej. martes tras el Monday
  // Night, todo a 0), se abre la anterior, que es la que interesa ver.
  const hayActividad = ligasSemana().some(l => {
    const e = estadoPartido(partidoDe(l.league_id, max));
    return e === 'en_juego' || e === 'final';
  });
  return (!hayActividad && max > 1) ? max - 1 : max;
}

function fmtPuntos(x) {
  return x == null ? '—' : Number(x).toFixed(2);
}

function claveOrdenSemana(it) {
  const margen = (it.p?.mis_puntos || 0) - (it.p?.puntos_rival || 0);
  let grupo = 5;
  if (it.estado === 'final') grupo = it.p.resultado === 'WIN' ? 0 : it.p.resultado === 'LOSE' ? 4 : 3;
  else if (it.estado === 'en_juego') grupo = 1;
  else if (it.estado === 'sin_empezar') grupo = 2;
  return [grupo, -margen];
}

function renderSemana() {
  const estado = document.getElementById('estado-semana');
  const nav = document.getElementById('nav-semana');
  const resumen = document.getElementById('resumen-semana');
  const lista = document.getElementById('lista-semana');
  if (!estado) return;

  if (!semanaListo || !calendarioListo) {
    estado.style.display = 'block'; estado.textContent = 'Cargando…';
    nav.style.display = 'none'; resumen.style.display = 'none'; lista.innerHTML = '';
    return;
  }

  const max = semanaMaxima();
  const ligas = ligasSemana();
  if (!max || !ligas.length) {
    estado.style.display = 'block'; estado.textContent = 'Sin datos de la semana todavía.';
    nav.style.display = 'none'; resumen.style.display = 'none'; lista.innerHTML = '';
    return;
  }
  estado.style.display = 'none';
  if (semanaSel === null || semanaSel > max || semanaSel < 1) semanaSel = semanaPorDefecto(max);

  nav.style.display = 'flex';
  document.getElementById('sem-prev').disabled = semanaSel <= 1;
  document.getElementById('sem-next').disabled = semanaSel >= max;
  document.getElementById('sem-titulo').textContent =
    'Semana ' + semanaSel + (semanaSel === max ? ' · en curso' : '');
  const meta = document.getElementById('sem-meta');
  if (semanaSel === max && semanaData?.generado) {
    meta.textContent = 'Último cambio de marcador: ' + new Date(semanaData.generado).toLocaleString('es-ES', {
      weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  } else {
    meta.textContent = '';
  }

  const items = ligas.map(l => {
    const p = partidoDe(l.league_id, semanaSel);
    return { l, p, estado: estadoPartido(p) };
  });

  const ganados = items.filter(i => i.estado === 'final' && i.p.resultado === 'WIN').length;
  const perdidos = items.filter(i => i.estado === 'final' && i.p.resultado === 'LOSE').length;
  const empatados = items.filter(i => i.estado === 'final').length - ganados - perdidos;
  const enJuego = items.filter(i => i.estado === 'en_juego').length;
  const sinEmpezar = items.filter(i => i.estado === 'sin_empezar').length;
  const sinDatos = items.filter(i => i.estado === 'sin_datos').length;

  const pl = (n, sing, plur) => `${n} ${n === 1 ? sing : plur}`;
  const partes = [
    `<span style="color:var(--verde)">${pl(ganados, 'ganado', 'ganados')}</span>`,
    `<span style="color:var(--rojo)">${pl(perdidos, 'perdido', 'perdidos')}</span>`,
  ];
  if (empatados) partes.push(`<span style="color:var(--muted)">${pl(empatados, 'empate', 'empates')}</span>`);
  if (enJuego) partes.push(`<span style="color:var(--ambar)">${enJuego} en juego</span>`);
  if (sinEmpezar) partes.push(`<span style="color:var(--muted)">${sinEmpezar} sin empezar</span>`);
  if (sinDatos) partes.push(`<span style="color:var(--muted)">${sinDatos} sin datos</span>`);
  resumen.style.display = 'block';
  resumen.innerHTML = partes.join(' · ');

  items.sort((a, b) => {
    const ka = claveOrdenSemana(a), kb = claveOrdenSemana(b);
    return (ka[0] - kb[0]) || (ka[1] - kb[1]);
  });

  lista.innerHTML = items.map(({ l, p, estado: e }) => {
    let clase = '', tag = 'Sin datos', color = 'var(--muted)';
    if (e === 'final') {
      if (p.resultado === 'WIN') { clase = 'gana'; tag = 'Ganado'; color = 'var(--verde)'; }
      else if (p.resultado === 'LOSE') { clase = 'pierde'; tag = 'Perdido'; color = 'var(--rojo)'; }
      else { tag = 'Empate'; }
    } else if (e === 'en_juego') {
      clase = 'juego'; tag = 'En juego';
      const margen = (p.mis_puntos || 0) - (p.puntos_rival || 0);
      color = margen > 0 ? 'var(--verde)' : margen < 0 ? 'var(--rojo)' : 'var(--muted)';
    } else if (e === 'sin_empezar') {
      tag = 'Sin empezar';
    }
    const tagColor = e === 'en_juego' ? 'var(--ambar)' : color;
    const rival = p
      ? `${p.local ? 'vs' : '@'} ${esc(p.rival)}${p.rival_record ? ' (' + esc(p.rival_record) + ')' : ''}`
      : 'Sin partido registrado';
    const puntos = p ? `${fmtPuntos(p.mis_puntos)} - ${fmtPuntos(p.puntos_rival)}` : '—';
    return `
      <div class="tarjeta-semana ${clase}">
        <div class="ts-info">
          <div class="ts-liga">${esc(l.liga)}</div>
          <div class="ts-equipo">${esc(l.equipo)}</div>
          <div class="ts-rival">${rival}</div>
        </div>
        <div class="ts-marcador">
          <div class="ts-puntos" style="color:${color}">${puntos}</div>
          <div class="ts-tag" style="color:${tagColor}">${tag}</div>
        </div>
      </div>`;
  }).join('');
}

function toggleCalendario(clave) {
  const cont = document.getElementById('cal-' + clave);
  const abierto = cont.style.display !== 'none';
  cont.style.display = abierto ? 'none' : 'block';
  if (abierto || cont.dataset.pintado) return;

  const leagueId = clave.replace('liga-', '');
  const liga = calendarioData?.ligas?.find(l => String(l.league_id) === leagueId);

  if (!calendarioData) {
    cont.innerHTML = '<div style="color:var(--muted);font-size:12.5px;">Calendario no disponible todavía.</div>';
    return;
  }
  if (!liga || !liga.semanas?.length) {
    cont.innerHTML = '<div style="color:var(--muted);font-size:12.5px;">Sin datos de calendario para esta liga.</div>';
    return;
  }

  cont.innerHTML = liga.semanas.map(s => {
    if (s.error) return '';
    const jugado = s.jugado;
    const gano = s.resultado === 'WIN';
    const perdio = s.resultado === 'LOSE';
    const color = jugado ? (gano ? 'var(--verde)' : perdio ? 'var(--rojo)' : 'var(--muted)') : 'var(--muted)';
    const marcador = jugado
      ? `${s.mis_puntos ?? '—'} - ${s.puntos_rival ?? '—'}`
      : 'Pendiente';
    const rivalRecord = s.rival_record ? ` (${esc(s.rival_record)})` : '';
    return `
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px;border-top:1px solid rgba(36,48,60,.5);">
        <span style="color:var(--muted);">S${s.semana} ${s.local ? 'vs' : '@'} ${esc(s.rival)}${rivalRecord}</span>
        <span style="color:${color};font-weight:600;">${marcador}</span>
      </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:12.5px;">Sin semanas registradas.</div>';

  cont.dataset.pintado = '1';
}

const FUENTE_LABEL = { fantasy: 'rendimiento real', draft: 'proyección' };

function pintarJugadoresRoster(jugadores) {
  return jugadores.map(j => `
    <div class="jugador-roster">
      <div class="jr-info">
        <div class="jr-nombre">${esc(j.nombre)}</div>
        <div class="jr-sub">${esc(j.equipo_nfl)}${j.hueco ? ' · ' + esc(GRUPOS[j.hueco] || j.hueco) : ''}</div>
      </div>
      <div class="jr-ranks">
        <div class="r-actual">${esc(j.rank || '—')}</div>
        <div style="color:var(--muted);font-size:11px;">${esc(FUENTE_LABEL[j.fuente] || 'sin datos')}</div>
      </div>
      <div class="nota-letra ${claseNota(j.nota_letra)}" style="font-size:14px;padding:2px 8px;">${j.nota_letra || '—'}</div>
    </div>`).join('') || '<div style="color:var(--muted);font-size:12.5px;">Sin jugadores.</div>';
}

let rostersData = null;
let rostersState = { nivel: 'ligas', liga: null, hueco: null, posicion: null };

function cargarRosters() {
  fetch('data/rosters.json?ts=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { rostersData = d; renderRosters(); })
    .catch(() => {
      document.getElementById('estado-rosters').style.display = 'block';
      document.getElementById('estado-rosters').textContent = 'No se pudieron cargar los rosters.';
    });
}

function claseNota(letra) {
  if (!letra) return 'n-vacia';
  if (letra === 'R') return 'n-rookie';
  if (letra === 'A+' || letra === 'A') return 'n-alta';
  if (letra === 'B+' || letra === 'B' || letra === 'C+') return 'n-media';
  return 'n-baja';
}

function renderRosters() {
  const estado = document.getElementById('estado-rosters');
  const breadcrumb = document.getElementById('breadcrumb-rosters');
  const lista = document.getElementById('lista-rosters');

  if (!rostersData || !rostersData.ligas?.length) {
    estado.style.display = 'block';
    estado.textContent = 'Sin datos de rosters todavía.';
    breadcrumb.style.display = 'none';
    lista.innerHTML = '';
    return;
  }
  estado.style.display = 'none';

  const partes = [];
  if (rostersState.liga) partes.push(rostersState.liga.equipo);
  if (rostersState.nivel.includes('hueco')) partes.push('Por hueco');
  if (rostersState.nivel.includes('equipo')) partes.push('Por posición');
  if (rostersState.hueco) partes.push(GRUPOS[rostersState.hueco] || rostersState.hueco);
  if (rostersState.posicion) partes.push(rostersState.posicion);
  breadcrumb.style.display = rostersState.nivel === 'ligas' ? 'none' : 'block';
  breadcrumb.innerHTML = rostersState.nivel === 'ligas' ? '' :
    '← <span style="text-decoration:underline;cursor:pointer;" id="btn-atras-rosters">Atrás</span> · ' + partes.map(esc).join(' / ');

  if (rostersState.nivel === 'ligas') {
    lista.innerHTML = rostersData.ligas.map((l, i) => `
      <button class="fila-roster" data-i="${i}">
        <div class="fr-info">
          <div class="fr-titulo">${esc(l.liga)}</div>
          <div class="fr-sub">${esc(l.equipo)}</div>
        </div>
        <div class="nota-letra ${claseNota(l.nota_general?.letra)}">${l.nota_general?.letra || '—'}</div>
      </button>`).join('');
    lista.querySelectorAll('.fila-roster').forEach(btn => {
      btn.addEventListener('click', () => {
        rostersState = { nivel: 'menu', liga: rostersData.ligas[btn.dataset.i], hueco: null, posicion: null };
        renderRosters();
      });
    });

  } else if (rostersState.nivel === 'menu') {
    const l = rostersState.liga;
    lista.innerHTML = `
      <button class="fila-roster" data-menu="posiciones-equipo">
        <div class="fr-info">
          <div class="fr-titulo">Por posición</div>
          <div class="fr-sub">Todo el roster agrupado por posición</div>
        </div>
        <div class="nota-letra ${claseNota(l.nota_general?.letra)}">${l.nota_general?.letra || '—'}</div>
      </button>
      <button class="fila-roster" data-menu="huecos">
        <div class="fr-info">
          <div class="fr-titulo">Por hueco</div>
          <div class="fr-sub">Titulares · Banco · Taxi · IR</div>
        </div>
        <div class="nota-letra ${claseNota(l.nota_general?.letra)}">${l.nota_general?.letra || '—'}</div>
      </button>`;
    lista.querySelectorAll('.fila-roster').forEach(btn => {
      btn.addEventListener('click', () => {
        rostersState.nivel = btn.dataset.menu;
        renderRosters();
      });
    });

  } else if (rostersState.nivel === 'posiciones-equipo') {
    const posiciones = rostersState.liga.posiciones || {};
    const labels = Object.keys(posiciones);
    lista.innerHTML = labels.length ? labels.map(label => {
      const p = posiciones[label];
      return `
      <button class="fila-roster" data-p="${esc(label)}">
        <div class="fr-info">
          <div class="fr-titulo">${esc(label)}</div>
          <div class="fr-sub">${p.jugadores.length} jugador${p.jugadores.length === 1 ? '' : 'es'}</div>
        </div>
        <div class="nota-letra ${claseNota(p.nota?.letra)}">${p.nota?.letra || '—'}</div>
      </button>`;
    }).join('') : '<div style="color:var(--muted);font-size:12.5px;padding:8px 2px;">Sin posiciones con datos.</div>';
    lista.querySelectorAll('.fila-roster').forEach(btn => {
      btn.addEventListener('click', () => {
        rostersState.nivel = 'jugadores-equipo';
        rostersState.posicion = btn.dataset.p;
        renderRosters();
      });
    });

  } else if (rostersState.nivel === 'jugadores-equipo') {
    const p = rostersState.liga.posiciones?.[rostersState.posicion];
    lista.innerHTML = pintarJugadoresRoster(p?.jugadores || []);

  } else if (rostersState.nivel === 'huecos') {
    const huecos = rostersState.liga.huecos || {};
    lista.innerHTML = Object.keys(GRUPOS).map(h => {
      const hu = huecos[h] || { nota: {}, posiciones: {} };
      const nPos = Object.keys(hu.posiciones || {}).length;
      return `
      <button class="fila-roster" data-h="${h}">
        <div class="fr-info">
          <div class="fr-titulo">${GRUPOS[h]}</div>
          <div class="fr-sub">${nPos} posici${nPos === 1 ? 'ón' : 'ones'}</div>
        </div>
        <div class="nota-letra ${claseNota(hu.nota?.letra)}">${hu.nota?.letra || '—'}</div>
      </button>`;
    }).join('');
    lista.querySelectorAll('.fila-roster').forEach(btn => {
      btn.addEventListener('click', () => {
        rostersState.nivel = 'posiciones-hueco';
        rostersState.hueco = btn.dataset.h;
        renderRosters();
      });
    });

  } else if (rostersState.nivel === 'posiciones-hueco') {
    const hu = rostersState.liga.huecos?.[rostersState.hueco] || { posiciones: {} };
    const labels = Object.keys(hu.posiciones);
    if (!labels.length) {
      lista.innerHTML = '<div style="color:var(--muted);font-size:12.5px;padding:8px 2px;">Sin jugadores en este hueco.</div>';
    } else {
      lista.innerHTML = labels.map(label => {
        const p = hu.posiciones[label];
        return `
        <button class="fila-roster" data-p="${esc(label)}">
          <div class="fr-info">
            <div class="fr-titulo">${esc(label)}</div>
            <div class="fr-sub">${p.jugadores.length} jugador${p.jugadores.length === 1 ? '' : 'es'}</div>
          </div>
          <div class="nota-letra ${claseNota(p.nota?.letra)}">${p.nota?.letra || '—'}</div>
        </button>`;
      }).join('');
    }
    lista.querySelectorAll('.fila-roster').forEach(btn => {
      btn.addEventListener('click', () => {
        rostersState.nivel = 'jugadores-hueco';
        rostersState.posicion = btn.dataset.p;
        renderRosters();
      });
    });

  } else if (rostersState.nivel === 'jugadores-hueco') {
    const p = rostersState.liga.huecos?.[rostersState.hueco]?.posiciones?.[rostersState.posicion];
    lista.innerHTML = pintarJugadoresRoster(p?.jugadores || []);
  }

  const btnAtras = document.getElementById('btn-atras-rosters');
  if (btnAtras) {
    btnAtras.addEventListener('click', () => {
      const n = rostersState.nivel;
      if (n === 'jugadores-equipo') { rostersState.nivel = 'posiciones-equipo'; rostersState.posicion = null; }
      else if (n === 'jugadores-hueco') { rostersState.nivel = 'posiciones-hueco'; rostersState.posicion = null; }
      else if (n === 'posiciones-hueco') { rostersState.nivel = 'huecos'; rostersState.hueco = null; }
      else if (n === 'posiciones-equipo' || n === 'huecos') { rostersState.nivel = 'menu'; }
      else if (n === 'menu') { rostersState.nivel = 'ligas'; rostersState.liga = null; }
      renderRosters();
    });
  }
}

function cargarTrades() {
  fetch('data/trades.json?ts=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => renderTrades(d))
    .catch(() => {
      document.getElementById('estado-trades').style.display = 'block';
      document.getElementById('estado-trades').textContent = 'No se pudieron cargar los trades.';
    });
}

function renderTrades(datosTrades) {
  const estadoTrades = document.getElementById('estado-trades');
  const lista = document.getElementById('lista-trades');
  const badge = document.getElementById('badge-trades');

  const ligas = (datosTrades.ligas || []).filter(l => (l.trades || []).length);
  const abiertosTotal = (datosTrades.ligas || [])
    .flatMap(l => l.trades || [])
    .filter(t => t.estado === 'TRADE_STATUS_OPEN').length;

  badge.style.display = abiertosTotal > 0 ? 'block' : 'none';
  badge.textContent = abiertosTotal;

  if (!ligas.length) {
    estadoTrades.style.display = 'block';
    estadoTrades.textContent = 'Sin trades pendientes en tus ligas.';
    lista.innerHTML = '';
    return;
  }
  estadoTrades.style.display = 'none';

  const ETIQUETAS = {
    TRADE_STATUS_OPEN: 'Pendiente',
    TRADE_STATUS_EXECUTED: 'Completado',
    TRADE_STATUS_REJECTED: 'Rechazado',
    TRADE_STATUS_VETOED: 'Vetado',
    TRADE_STATUS_CANCELED: 'Cancelado',
    TRADE_STATUS_INVALIDATED: 'Invalidado',
  };

  lista.innerHTML = ligas.map(l => `
    <div class="seccion-titulo">${esc(l.liga)}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px;">
      ${l.trades.map(t => `
        <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <span style="font-weight:600;font-size:13px;">${esc(ETIQUETAS[t.estado] || t.estado || 'Estado desconocido')}</span>
          </div>
          ${t.lados.map(lado => `
            <div style="font-size:12.5px;color:var(--muted);margin-top:2px;">
              <strong style="color:var(--text);">${esc(lado.equipo)}</strong> recibe: ${lado.recibe.length ? lado.recibe.map(esc).join(', ') : '—'}
            </div>`).join('')}
        </div>`).join('')}
    </div>
  `).join('');
}

document.getElementById('actualizar').addEventListener('click', () => { cargar(); cargarSemana(); });

document.getElementById('sem-prev').addEventListener('click', () => {
  if (semanaSel > 1) { semanaSel--; renderSemana(); }
});
document.getElementById('sem-next').addEventListener('click', () => {
  const max = semanaMaxima();
  if (max && semanaSel < max) { semanaSel++; renderSemana(); }
});

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('activo'));
    document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
    btn.classList.add('activo');
    document.getElementById('vista-' + btn.dataset.vista).classList.add('activa');
  });
});

cargar();
cargarCalendario();
cargarSemana();
cargarTrades();
cargarRosters();
</script>
</body>
</html>
